name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly: catches vitest / jest / pytest / Claude Code changes

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag in the comment). To bump one, resolve the new tag:
#   git ls-remote https://github.com/actions/checkout.git 'refs/tags/v7.0.1^{}' 'refs/tags/v7.0.1'
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: npm run test:e2e

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 2.1.292: npm "stable" tag. 2.1.301: the version verified in real sessions. latest: early warning.
        claude-code: ['2.1.292', '2.1.301', 'latest']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g "@anthropic-ai/claude-code@${{ matrix.claude-code }}"
      - run: claude --version
      - run: claude plugin validate . --strict
      - run: claude plugin validate agents --strict
      - run: claude plugin validate skills --strict

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit, e2e, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the manifest versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in package.json .claude-plugin/plugin.json; do
            v=$(node -p "require('./$f').version")
            [ "$v" = "$tag" ] || { echo "::error file=$f::version $v does not match tag $GITHUB_REF_NAME"; exit 1; }
          done
      - name: Build the tarball and its checksum
        run: |
          name="agent-test-budget-${GITHUB_REF_NAME}"
          mkdir dist
          git archive --format=tar --prefix="$name/" "$GITHUB_SHA" | gzip -n > "dist/$name.tar.gz"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" && cat "$name.tar.gz.sha256")
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Source of tag $GITHUB_REF_NAME (commit $GITHUB_SHA). Verify with: shasum -a 256 -c agent-test-budget-$GITHUB_REF_NAME.tar.gz.sha256" \
            --verify-tag
